<!DOCTYPE html>
<html>
<head>
    <title>ISL Recognition</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .video-box {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 15px;
        }
        #video {
            width: 100%;
            border-radius: 10px;
        }
        .predictions {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 15px;
        }
        .pred-item {
            margin: 10px 0;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }
        .pred-label {
            font-weight: bold;
            font-size: 1.2em;
        }
        .number {
            color: #ff9500;
        }
        .letter {
            color: #00ff64;
        }
        .sentence-box {
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 15px;
        }
        .sentence-display {
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 10px;
            min-height: 60px;
            font-size: 2em;
            text-align: center;
            color: #00ffff;
            margin-bottom: 15px;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .btn-add {
            background: #00ff64;
            color: #000;
        }
        .btn-delete {
            background: #ff6b6b;
            color: white;
        }
        .btn-clear {
            background: #ffd93d;
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤟 ISL Real-Time Recognition</h1>
        
        <div class="main">
            <div class="video-box">
                <img id="video" src="/video_feed" alt="Loading...">
            </div>
            
            <div class="predictions">
                <h2>📊 Predictions</h2>
                <div id="predictions-list"></div>
            </div>
        </div>
        
        <div class="sentence-box">
            <h2>📝 Sentence Builder</h2>
            <div id="sentence" class="sentence-display">Start signing...</div>
            <div class="controls">
                <button class="btn-add" onclick="addToSentence()">➕ Add</button>
                <button class="btn-delete" onclick="deleteLast()">⌫ Delete</button>
                <button class="btn-clear" onclick="clearSentence()">🗑️ Clear</button>
            </div>
        </div>
    </div>

    <script>
        // Update predictions every 200ms
        setInterval(updatePredictions, 200);

        function updatePredictions() {
            fetch('/get_predictions')
                .then(r => r.json())
                .then(data => {
                    // Update predictions
                    const list = document.getElementById('predictions-list');
                    if (data.predictions.length === 0) {
                        list.innerHTML = '<p style="opacity:0.5;">No hand detected</p>';
                    } else {
                        list.innerHTML = '';
                        data.predictions.forEach((pred, i) => {
                            const div = document.createElement('div');
                            div.className = 'pred-item';
                            div.innerHTML = `
                                <div class="pred-label ${pred.type}">
                                    ${i+1}. ${pred.type === 'number' ? '[NUM]' : '[LTR]'} ${pred.label}
                                </div>
                                <div>${(pred.confidence * 100).toFixed(1)}%</div>
                            `;
                            list.appendChild(div);
                        });
                    }
                    
                    // Update sentence
                    document.getElementById('sentence').textContent = 
                        data.sentence || 'Start signing...';
                });
        }

        function addToSentence() {
            fetch('/add_prediction')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('sentence').textContent = 
                        data.sentence || 'Start signing...';
                });
        }

        function deleteLast() {
            fetch('/delete_last')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('sentence').textContent = 
                        data.sentence || 'Start signing...';
                });
        }

        function clearSentence() {
            fetch('/clear')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('sentence').textContent = 
                        data.sentence || 'Start signing...';
                });
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ') {
                e.preventDefault();
                addToSentence();
            } else if (e.key === 'Backspace') {
                e.preventDefault();
                deleteLast();
            } else if (e.key.toLowerCase() === 'c') {
                e.preventDefault();
                clearSentence();
            }
        });
    </script>
</body>
</html>
