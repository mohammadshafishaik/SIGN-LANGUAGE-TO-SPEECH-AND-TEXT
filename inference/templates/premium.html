<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignSpeak AI - Next-Gen Sign Language Recognition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --success: #10b981;
            --bg-dark: #0a0a0f;
            --bg-card: rgba(255, 255, 255, 0.03);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Animated Background */
        .bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.8;
            animation: float 15s ease-in-out infinite;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.6), transparent);
            top: -20%;
            left: -15%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.6), transparent);
            top: 40%;
            right: -15%;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.6), transparent);
            bottom: -20%;
            left: 25%;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { 
                transform: translate(0, 0) scale(1);
            }
            25% { 
                transform: translate(100px, -80px) scale(1.15);
            }
            50% { 
                transform: translate(-80px, 100px) scale(0.9);
            }
            75% { 
                transform: translate(80px, 80px) scale(1.1);
            }
        }

        /* Animated particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(99, 102, 241, 0.6);
            border-radius: 50%;
            animation: particleFloat 20s linear infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(100px) scale(1);
                opacity: 0;
            }
        }

        /* Animated grid */
        .animated-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            opacity: 0.3;
        }

        @keyframes gridMove {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        /* Main Container */
        .app-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            backdrop-filter: blur(20px);
            background: rgba(10, 10, 15, 0.8);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            position: relative;
        }

        .logo-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.5));
        }

        .logo-text {
            font-size: 1.5em;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .top-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .theme-btn {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2em;
        }

        .theme-btn:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
            padding: 30px 40px;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Glass Card */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 0;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 20px 60px rgba(99, 102, 241, 0.1);
        }

        .card-header {
            padding: 25px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            font-weight: 700;
        }

        .card-title {
            font-size: 1.2em;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .card-body {
            padding: 30px;
        }

        /* Video Feed */
        .video-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16/9;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        #videoFeed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }

        .live-badge {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 10px 18px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85em;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.5);
        }

        .pulse {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            50% { opacity: 0.5; box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
        }

        /* Sentence Builder */
        .sentence-display {
            min-height: 200px;
            max-height: 200px;
            overflow-y: auto;
            padding: 25px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-content: flex-start;
            margin-bottom: 20px;
        }

        .sentence-display::-webkit-scrollbar {
            width: 6px;
        }

        .sentence-display::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .sentence-display::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px;
        }

        .word-chip {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.05em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            animation: chipIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes chipIn {
            from { opacity: 0; transform: scale(0.5) rotate(-10deg); }
            to { opacity: 1; transform: scale(1) rotate(0); }
        }

        .word-chip:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
        }

        .empty-state {
            width: 100%;
            text-align: center;
            color: var(--text-secondary);
            font-style: italic;
            padding: 60px 20px;
        }

        /* Action Buttons */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .action-btn {
            padding: 16px 24px;
            border: none;
            border-radius: 14px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .action-btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--primary);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(239, 68, 68, 0.6);
        }

        /* Predictions */
        .predictions-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .prediction-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        /* Remove animation to prevent flickering */

        .prediction-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .prediction-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .prediction-label {
            font-size: 1.3em;
            font-weight: 700;
        }

        .prediction-confidence {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--success);
        }

        .progress-track {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 10px;
            transition: width 0.5s ease;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }

        /* Settings */
        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-label {
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* Toggle Switch */
        .toggle {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.2);
            transition: 0.3s;
            border-radius: 34px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }

        /* Slider */
        .slider-container {
            flex: 1;
            max-width: 200px;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.5);
            transition: all 0.3s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.85em;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* Light Theme */
        body.light {
            --bg-dark: #f8f9fa;
            --bg-card: rgba(255, 255, 255, 0.9);
            --text-primary: #1a1a1a;
            --text-secondary: rgba(0, 0, 0, 0.6);
            --border: rgba(0, 0, 0, 0.1);
        }

        body.light .orb {
            opacity: 0.2;
        }

        body.light .top-bar {
            background: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        body.light .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        body.light .glass-card:hover {
            border-color: var(--primary);
            box-shadow: 0 20px 60px rgba(99, 102, 241, 0.15);
        }

        body.light .card-header {
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        body.light .btn-secondary {
            background: rgba(0, 0, 0, 0.08);
            color: #1a1a1a;
            border: 1px solid rgba(0, 0, 0, 0.15);
        }

        body.light .btn-secondary:hover {
            background: rgba(0, 0, 0, 0.12);
            border-color: var(--primary);
        }

        body.light .sentence-display {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        body.light .empty-state {
            color: rgba(0, 0, 0, 0.4);
        }

        body.light .prediction-item {
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        body.light .prediction-item:hover {
            background: rgba(0, 0, 0, 0.08);
            border-color: var(--primary);
        }

        body.light .stat-box {
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        body.light .progress-track {
            background: rgba(0, 0, 0, 0.1);
        }

        body.light .theme-btn {
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        body.light .theme-btn:hover {
            background: rgba(0, 0, 0, 0.12);
        }

        body.light .animated-grid {
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
        }

        body.light .particle {
            background: rgba(99, 102, 241, 0.3);
        }

        body.light .live-badge {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: #1a1a1a;
        }

        body.light .video-wrapper {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        /* Glow effect on cards */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                var(--primary), 
                var(--secondary), 
                var(--accent), 
                var(--primary));
            border-radius: 24px;
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s ease;
            background-size: 300% 300%;
            animation: gradientShift 8s ease infinite;
        }

        .glass-card:hover::before {
            opacity: 0.3;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-canvas">
        <div class="animated-grid"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="particles" id="particles"></div>
    </div>

    <!-- App Container -->
    <div class="app-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <!-- Hand gesture -->
                        <path d="M20 8 L20 25 M15 15 L15 25 M25 15 L25 25 M10 20 L10 28 M30 20 L30 28" 
                              stroke="url(#logoGrad)" stroke-width="3" stroke-linecap="round"/>
                        <!-- Sound waves -->
                        <path d="M32 12 Q35 15 32 18" stroke="url(#logoGrad)" stroke-width="2" 
                              stroke-linecap="round" fill="none" opacity="0.6"/>
                        <path d="M35 10 Q39 15 35 20" stroke="url(#logoGrad)" stroke-width="2" 
                              stroke-linecap="round" fill="none" opacity="0.4"/>
                    </svg>
                </div>
                <span class="logo-text">SignSpeak AI</span>
            </div>
            <div class="top-controls">
                <div class="theme-btn" onclick="toggleTheme()" id="themeBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Column -->
            <div style="display: flex; flex-direction: column; gap: 30px;">
                <!-- Video Feed -->
                <div class="glass-card">
                    <div class="card-header">
                        <div class="card-title-group">
                            <div class="card-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M23 7l-7 5 7 5V7z"></path>
                                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                                </svg>
                            </div>
                            <h2 class="card-title">Live Recognition</h2>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="video-wrapper">
                            <img id="videoFeed" src="" alt="Video Feed">
                            <div class="video-overlay">
                                <div class="live-badge">
                                    <div class="pulse"></div>
                                    <span>LIVE</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sentence Builder -->
                <div class="glass-card">
                    <div class="card-header">
                        <div class="card-title-group">
                            <div class="card-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="17" y1="10" x2="3" y2="10"></line>
                                    <line x1="21" y1="6" x2="3" y2="6"></line>
                                    <line x1="21" y1="14" x2="3" y2="14"></line>
                                    <line x1="17" y1="18" x2="3" y2="18"></line>
                                </svg>
                            </div>
                            <h2 class="card-title">Sentence Builder</h2>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="sentence-display" id="sentenceDisplay">
                            <div class="empty-state">Start signing to build your sentence...</div>
                        </div>
                        <div class="action-grid">
                            <button class="action-btn btn-primary" onclick="speakSentence()">
                                Speak
                            </button>
                            <button class="action-btn btn-secondary" onclick="addTopWord()">
                                Add Word
                            </button>
                            <button class="action-btn btn-secondary" onclick="deleteWord()">
                                Delete
                            </button>
                            <button class="action-btn btn-danger" onclick="clearSentence()">
                                Clear
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Stats -->
                <div class="glass-card">
                    <div class="card-header">
                        <div class="card-title-group">
                            <div class="card-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="20" x2="18" y2="10"></line>
                                    <line x1="12" y1="20" x2="12" y2="4"></line>
                                    <line x1="6" y1="20" x2="6" y2="14"></line>
                                </svg>
                            </div>
                            <h2 class="card-title">Statistics</h2>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="stats-grid">
                            <div class="stat-box">
                                <div class="stat-value" id="totalWords">0</div>
                                <div class="stat-label">Words Recognized</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-value" id="avgConfidence">0%</div>
                                <div class="stat-label">Avg Confidence</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Column -->
            <div style="display: flex; flex-direction: column; gap: 30px;">
                <!-- Predictions -->
                <div class="glass-card">
                    <div class="card-header">
                        <div class="card-title-group">
                            <div class="card-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <circle cx="12" cy="12" r="6"></circle>
                                    <circle cx="12" cy="12" r="2"></circle>
                                </svg>
                            </div>
                            <h2 class="card-title">Top Predictions</h2>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="predictions-list" id="predictionsList">
                            <!-- Predictions will be inserted here -->
                        </div>
                    </div>
                </div>

                <!-- Settings -->
                <div class="glass-card">
                    <div class="card-header">
                        <div class="card-title-group">
                            <div class="card-icon">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path d="M12 1v6m0 6v6m5.2-13.2l-4.2 4.2m0 6l4.2 4.2M23 12h-6m-6 0H1m18.2 5.2l-4.2-4.2m-6 0l-4.2 4.2"></path>
                                </svg>
                            </div>
                            <h2 class="card-title">Settings</h2>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="settings-group">
                            <div class="setting-item">
                                <span class="setting-label">Speech Control</span>
                                <label class="toggle">
                                    <input type="checkbox" id="speechToggle" checked onchange="toggleSpeech()">
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                            <div class="setting-item">
                                <span class="setting-label">Auto-Speak on Add</span>
                                <label class="toggle">
                                    <input type="checkbox" id="autoSpeakToggle" onchange="toggleAutoSpeak()">
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                            <div class="setting-item">
                                <span class="setting-label">Auto-Add (90% / 2s)</span>
                                <label class="toggle">
                                    <input type="checkbox" id="autoAddToggle" onchange="toggleAutoAdd()">
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                            <div class="setting-item">
                                <span class="setting-label">Volume: <span id="volumeValue">80%</span></span>
                                <div class="slider-container">
                                    <input type="range" class="slider" min="0" max="100" value="80" id="volumeSlider">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        let sentence = [];
        let topWord = '';
        let totalRecognized = 0;
        let confidenceSum = 0;
        let speechEnabled = true;
        let autoSpeak = false;
        let autoAdd = false;
        let lastHighConfWord = null;
        let highConfStartTime = null;
        let lastAddedTime = 0;
        const ADD_COOLDOWN = 500; // 500ms cooldown after adding

        // Update frame
        function updateFrame() {
            fetch('/get_frame')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('videoFeed').src = 'data:image/jpeg;base64,' + data.frame;
                    
                    const list = document.getElementById('predictionsList');
                    list.innerHTML = '';
                    
                    if (data.predictions && data.predictions.length > 0) {
                        topWord = data.predictions[0].label;
                        const topConfidence = data.predictions[0].confidence;
                        
                        data.predictions.forEach((pred, i) => {
                            const conf = (pred.confidence * 100).toFixed(1);
                            const div = document.createElement('div');
                            div.className = 'prediction-item';
                            div.onclick = () => speakWord(pred.label);
                            div.innerHTML = `
                                <div class="prediction-header">
                                    <span class="prediction-label">${i + 1}. ${pred.label}</span>
                                    <span class="prediction-confidence">${conf}%</span>
                                </div>
                                <div class="progress-track">
                                    <div class="progress-bar" style="width: ${conf}%"></div>
                                </div>
                            `;
                            list.appendChild(div);
                        });
                        
                        confidenceSum += topConfidence;
                        totalRecognized++;
                        document.getElementById('totalWords').textContent = totalRecognized;
                        document.getElementById('avgConfidence').textContent = 
                            ((confidenceSum / totalRecognized) * 100).toFixed(0) + '%';
                        
                        // Auto-add logic
                        if (autoAdd && topConfidence >= 0.90) {
                            const now = Date.now();
                            
                            // Check if we're in cooldown period
                            if (now - lastAddedTime < ADD_COOLDOWN) {
                                return; // Skip during cooldown
                            }
                            
                            if (lastHighConfWord === topWord) {
                                // Same word held for duration
                                if (highConfStartTime && (now - highConfStartTime >= 2000)) {
                                    addTopWord();
                                    lastAddedTime = now; // Record add time
                                    lastHighConfWord = null;
                                    highConfStartTime = null;
                                }
                            } else {
                                // New word detected, start tracking
                                lastHighConfWord = topWord;
                                highConfStartTime = now;
                            }
                        } else {
                            // Reset if confidence drops below 90%
                            if (topConfidence < 0.90) {
                                lastHighConfWord = null;
                                highConfStartTime = null;
                            }
                        }
                    }
                })
                .catch(e => console.error(e));
        }

        function speakWord(word) {
            if (speechEnabled) {
                fetch('/speak_word', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({word: word})
                });
            }
        }

        function addTopWord() {
            if (topWord) {
                sentence.push(topWord);
                updateSentence();
                if (autoSpeak) speakWord(topWord);
            }
        }

        function deleteWord() {
            sentence.pop();
            updateSentence();
        }

        function clearSentence() {
            sentence = [];
            updateSentence();
        }

        function speakSentence() {
            const text = sentence.join(' ');
            if (text) speakWord(text);
        }

        function updateSentence() {
            const display = document.getElementById('sentenceDisplay');
            if (sentence.length === 0) {
                display.innerHTML = '<div class="empty-state">Start signing to build your sentence...</div>';
            } else {
                display.innerHTML = sentence.map(w => 
                    `<div class="word-chip" onclick="speakWord('${w}')">${w}</div>`
                ).join('');
            }
        }

        function toggleSpeech() {
            speechEnabled = document.getElementById('speechToggle').checked;
        }

        function toggleAutoSpeak() {
            autoSpeak = document.getElementById('autoSpeakToggle').checked;
        }

        function toggleAutoAdd() {
            autoAdd = document.getElementById('autoAddToggle').checked;
            lastHighConfWord = null;
            highConfStartTime = null;
        }

        function toggleTheme() {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            const btn = document.getElementById('themeBtn');
            btn.innerHTML = isLight ? 
                '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>' :
                '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }

        function loadTheme() {
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light');
                document.getElementById('themeBtn').innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
            }
        }

        document.getElementById('volumeSlider').oninput = (e) => {
            document.getElementById('volumeValue').textContent = e.target.value + '%';
        };

        document.onkeydown = (e) => {
            if (e.code === 'Space') { e.preventDefault(); addTopWord(); }
            else if (e.code === 'Backspace' && e.target.tagName !== 'INPUT') { e.preventDefault(); deleteWord(); }
            else if (e.code === 'KeyS') speakSentence();
            else if (e.code === 'KeyC') clearSentence();
        };

        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }

        loadTheme();
        createParticles();
        setInterval(updateFrame, 100);
    </script>
</body>
</html>
