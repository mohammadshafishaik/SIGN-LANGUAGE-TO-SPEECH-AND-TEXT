services:
  - type: web
    name: signspeak-ai
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd /opt/render/project/src && PYTHONPATH=. gunicorn inference.app_deploy:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --preload"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: PYTHONPATH
        value: /opt/render/project/src
